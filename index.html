<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحكمة السرية</title>
  <style>
    body { font-family: Tahoma, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
    #game-container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    button { background: #6200ee; color: white; border: none; padding: 10px 20px; margin: 5px; border-radius: 5px; cursor: pointer; font-size: 16px; }
    button:hover { background: #3700b3; }
    .card-list { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
    .card { background: #2d2d2d; border: 1px solid #444; padding: 10px; border-radius: 5px; width: 120px; }
  </style>
</head>
<body>

  <div id="game-container">
    <h1>المحكمة السرية</h1>
    <div id="status-area">
      <p id="player-info">اللاعب الحالي: <span id="current-name">-</span></p>
      <p>نقاط السمعة: <span id="current-reputation">0</span></p>
    </div>

    <hr>

    <h3>متجر البطاقات</h3>
    <div class="card-list">
      <button onclick="buyCard(1)">شراء بطاقة (1 نقطة)</button>
      <button onclick="buyCard(2)">شراء بطاقة (2 نقاط)</button>
    </div>

    <h3>بطاقاتي</h3>
    <div id="my-cards" class="card-list"></div>
  </div>

  <script>
    // حالة اللعبة الافتراضية
    let gameState = {
      activePlayerIndex: 0,
      players: [
        { id: 'p1', name: 'ايفا', reputation: 5 }
      ],
      hands: {
        'p1': []
      }
    };

    function renderGame() {
      const p = gameState.players[gameState.activePlayerIndex];
      if (!p) return;

      document.getElementById('current-name').innerText = p.name;
      document.getElementById('current-reputation').innerText = p.reputation;

      const myCardsContainer = document.getElementById('my-cards');
      myCardsContainer.innerHTML = '';
      
      const hand = gameState.hands[p.id] || [];
      hand.forEach(card => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `<strong>${card.name}</strong><br><small>${card.desc}</small>`;
        myCardsContainer.appendChild(div);
      });
    }

    async function buyCard(cost) {
      const p = gameState.players[gameState.activePlayerIndex];
      if (!p) {
        alert('لا يوجد لاعب نشط حالياً!');
        return;
      }

      try {
        const response = await fetch('/api/game', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            action: 'buy_card', 
            players: gameState.players, 
            playerId: p.id, 
            cost: cost 
          })
        });
        
        const data = await response.json();
        
        if (!response.ok || data.error) {
          alert(data.message || 'فشل شراء البطاقة.');
          return;
        }
        
        gameState.players = data.players;
        
        if (!gameState.hands[p.id]) {
          gameState.hands[p.id] = [];
        }
        
        gameState.hands[p.id].push(data.boughtCard);
        
        renderGame();
        alert(`تم شراء البطاقة "${data.boughtCard.name}" بنجاح وإضافتها ليدك!`);
        
      } catch (err) {
        console.error('Error during card purchase:', err);
        alert('حدث خطأ في الاتصال بالخادم أثناء محاولة شراء البطاقة.');
      }
    }

    // التشغيل الأولي
    window.onload = () => {
      renderGame();
    };
  </script>

</body>
</html>
